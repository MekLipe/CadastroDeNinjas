spring.application.name=CadastroDeNinjas

spring.datasource.url=${DATABASE_URL:jdbc:h2:file:D:/Java10x/CadastroDeNinjas/data/CadastroDeNinjasDB}
spring.datasource.driver=org.h2.Driver
spring.datasource.username=${DATABASE_USERNAME:cadastro_bd}
spring.datasource.password=${DATABASE_PASSWORD:admin}

#Configuracoes do JPA // HIBERNATES
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

#Configuracoes do flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db.migration
spring.flyway.baseline-on-migrate=true
